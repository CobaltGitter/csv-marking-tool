<!DOCTYPE html>
<html lang = 'en'>
<head>
    <meta charset = 'UTF-8'>
    <meta name = 'viewport' content = 'width=device-width, initial-scale=1.0'>
    <title> Automatic Marker</title>
    <link rel="stylesheet" href="./dist/core.css">
    <script defer src="./dist/js/script.js"></script>
</head>

<body>
    <main class="container">
        <h1>Automatic Marker</h1>
        <p class = 'muted'>Upload a CSV -> choose settings -> mark -> download results.</p>
        
        <section class="card">
            <h2>1. Upload CSV</h2>
            <input id="file" type="file" accept=".csv,text/csv" />
            <div id="fileInfo" class="muted"></div>
        </section>

        <section class="card">
            <h2>2. Settings</h2>
            <div class="grid">
                <label>
                    number_mode
                    <select id="number_mode">
                        <option value="relative" selected>relative</option>
                        <option value="absolute">absolute</option>
                    </select>
                </label>
                <label>
                    tolerance
                    <input id="tolerance" type="number" step="0.000001" value="0.001" />
                </label>
                <label>
                    spell_threshold (%)
                    <input id="spell_threshold" type="number" min="0" max="100" value="80" />
                </label>
                <label>
                    list_delim (optional)
                    <input id="list_delim" type="text" placeholder="e.g. ; or |" />
                </label>
                <label>
                    list_order
                    <select id="list_order">
                        <option value="ignore" selected>ignore</option>
                        <option value="enforce">enforce</option>
                    </select>
                </label>
            </div>
            <div class="buttons">
                <button id="pingBtn" type="button">Ping</button>
                <button id="markBtn" type="button" class="primary">Mark</button>
                <button id="downloadBtn" type="button" disabled>Download results</button>
            </div>
            <div id="status" class="status">Ready.</div>
        </section>

        <section class="card">
            <h2>3. Preview (optional)</h2>
            <div class="preview-grid">
                <div>
                    <h3> Input preview</h3>
                    <pre id = 'inputPreview' class="preview"></pre>
                </div>
            </div>
            <div>
                <h3>Output preview</h3>
                <pre id="outputPreview" class="preview"></pre>
            </div>
        </section>
    </main>
</body>
</html>
